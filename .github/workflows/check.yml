name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust tests
        run: cargo test --locked
      - name: Build pipeline
        run: cargo build --release --locked
      - name: Install fixture checker
        run: python3 -m pip install polars==1.44.2
      - name: Check challenge fixtures
        run: python3 scripts/run_fixtures.py fixtures -- ./target/release/shopping-sessions
      - name: Build container image
        run: docker build --platform linux/amd64 -t shopping-sessions .
