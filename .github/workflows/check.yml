name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust tests
        run: cargo test --locked
      - name: Build container image
        run: docker build --platform linux/amd64 -t shopping-sessions .
