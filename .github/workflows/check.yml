name: Container check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --platform linux/amd64 -t shopping-sessions .
      - name: Check executable dependencies
        run: |
          docker run --rm --entrypoint /bin/sh shopping-sessions -c '
            set -e
            dependencies=$(ldd /usr/local/bin/shopping-sessions)
            printf "%s\n" "$dependencies"
            ! printf "%s\n" "$dependencies" | grep -q "not found"
          '
